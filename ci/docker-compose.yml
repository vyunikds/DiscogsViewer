services:
  jenkins:
    # built from ci/Dockerfile.jenkins: jenkins/lts + docker CLI (agent provisioning)
    image: discogsviewer-jenkins:17
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"   # Jenkins UI
      - "50000:50000" # inbound agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      # required by the Docker plugin to start build-agent containers
      - /var/run/docker.sock:/var/run/docker.sock
      # local repo checkout for the pipeline job (use a GitHub URL in production)
      - ..:/repos/DiscogsViewer:ro
    environment:
      # -Xmx1g for Jenkins itself; ALLOW_LOCAL_CHECKOUT is needed for the local
      # git checkout in E2E (use a remote GitHub URL in production instead)
      - JAVA_OPTS=-Xmx1g -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true

volumes:
  jenkins_home:
